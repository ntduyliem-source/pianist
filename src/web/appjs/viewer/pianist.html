<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pianist</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font:14px system-ui,sans-serif;color:#20232b;background:#f4f4f5;color-scheme:light}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    #screen{position:fixed;inset:0;width:100%;height:100%;background:#c5c8d0}
    #loading{position:fixed;inset:0;z-index:10;display:grid;place-content:center;gap:12px;text-align:center;background:#f6f6f7}
    #loading[hidden]{display:none}.wordmark{font-size:32px;font-weight:650;letter-spacing:-.04em}.loader{width:160px;height:3px;background:#d9dce1;margin:10px auto;overflow:hidden}.loader::after{content:'';display:block;width:50%;height:100%;background:#377cc8;animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(100%)}}
    #status{position:fixed;bottom:42px;left:12px;z-index:15;margin:0;max-width:min(560px,90vw);padding:10px 14px;background:#fff;border:1px solid #d2d5dc;border-radius:4px;box-shadow:0 3px 16px #0002;pointer-events:none;opacity:0;transition:opacity .15s}#status.show{opacity:1}
    dialog{min-width:360px;max-width:min(520px,90vw);border:1px solid #b7bbc4;border-radius:7px;padding:24px;color:inherit;background:#fafafa;box-shadow:0 18px 80px #0004}dialog::backdrop{background:#0004}dialog h2{font-size:18px;margin:0 0 16px}dialog p{line-height:1.6}dialog label{display:block;margin-bottom:8px}dialog select{width:100%;padding:8px;background:#fff;border:1px solid #aeb4bd;border-radius:3px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}button{font:inherit;padding:7px 16px;border:1px solid #aeb4bd;border-radius:4px;background:#f8f8f8;color:inherit;cursor:pointer}button.primary{color:#fff;background:#3277c7;border-color:#3277c7}button:disabled{opacity:.45;cursor:wait}a{color:#2670bd}
    #file{display:none}#diagnostics{position:fixed;z-index:20;top:30px;left:8px;max-width:750px;padding:8px;background:#fff;border:1px solid #c0c5cc;border-radius:4px;box-shadow:0 3px 20px #0002}#diagnostics[hidden]{display:none}#diagnostics button{padding:5px 8px;font-size:12px}#log{max-height:90px;overflow:auto;font-size:11px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main id="screen" aria-label="Pianist score editor"></main>
  <div id="loading" role="status"><div class="wordmark">Pianist</div><span>Opening score editor…</span><div class="loader"></div></div>
  <p id="status" role="status" aria-live="polite"></p>
  <input id="file" type="file" accept=".mxl,.xml,.musicxml,.mscz,.mscx" aria-label="Open score file">
  <dialog id="export-dialog" aria-labelledby="export-title">
    <h2 id="export-title">Export</h2><label for="export-format">Format</label>
    <select id="export-format"><option value="mxl">Compressed MusicXML (.mxl)</option><option value="musicxml">MusicXML (.musicxml)</option></select>
    <p>Export a copy of the current score. Use Save to keep a MuseScore project.</p>
    <div class="actions"><button id="cancel-export">Cancel</button><button id="confirm-export" class="primary">Export</button></div>
  </dialog>
  <dialog id="unsaved-dialog" aria-labelledby="unsaved-title">
    <h2 id="unsaved-title">Save changes?</h2><p id="unsaved-text"></p>
    <div class="actions"><button id="cancel-replace">Cancel</button><button id="discard-replace">Discard</button><button id="save-replace" class="primary">Save</button></div>
  </dialog>
  <dialog id="about-dialog" aria-labelledby="about-title">
    <h2 id="about-title">Pianist</h2><p>Web notation editor, based on MuseScore Studio 4.7.5.</p>
    <p><a href="LICENSE.txt" target="_blank" rel="noopener">GNU General Public License v3</a> · MuseScore contributors</p>
    <div class="actions"><button id="close-about" class="primary">OK</button></div>
  </dialog>
  <aside id="diagnostics" hidden aria-label="Developer acceptance checks" style="top:auto;left:auto;bottom:40px;right:8px">
    <button id="open" disabled>Open</button><button id="sample" disabled>Sample score</button>
    <button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button>
    <button id="save" disabled>Save MSCZ</button><button id="mxl" disabled>Export MXL</button>
    <button id="audio" disabled>Audio</button><button id="select" disabled>Select all</button>
    <button id="up" disabled>Pitch up</button><button id="xml" disabled>Export XML</button>
    <pre id="log"></pre>
  </aside>
  <script src="MuseScoreStudio.js"></script>
  <script type="module">
    import createMuApi from './distr/muapi.js';
    const $ = id => document.getElementById(id);
    const diagnostics = new URLSearchParams(location.search).has('diagnostics');
    $('diagnostics').hidden = !diagnostics;
    let api, name = 'Untitled score', hasScore = false, dirty = false, pendingAction = null, toastTimer, audioUnlocked = false;
    const log = message => { $('log').textContent += message + '\n'; };
    const status = message => {
      $('status').textContent = message; log(message);
      if (message) { $('status').classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('status').classList.remove('show'),4500); }
    };
    function focusEditor(windowElement) {
      if (document.querySelector('dialog[open]')) return;
      const root = $('screen').querySelector('#qt-shadow-container')?.shadowRoot;
      const window = windowElement ?? root?.querySelector('.qt-decorated-window:not(.inactive) .qt-window');
      if (window && !window.contains(root.activeElement)) window.querySelector('.qt-window-focus-helper')?.focus({preventScroll:true});
    }
    function unlockAudio() {
      if (api?.Module.driver?.inited && !audioUnlocked) { api.Module.driver.resume(); audioUnlocked=true; }
    }
    $('screen').addEventListener('pointerdown', event => {
      unlockAudio();
      focusEditor(event.composedPath().find(element => element.classList?.contains('qt-window')));
    },true);
    function setLoaded(filename) {
      name = filename.replace(/\.[^.]+$/, ''); hasScore = true;
      ['undo','redo','save','mxl','select','up','xml'].forEach(id => $(id).disabled=false);
      status('Đã mở ' + filename + '.');
    }
    function download(bytes,extension) {
      const blob = new Blob([bytes],{type:extension==='musicxml'?'application/xml':'application/octet-stream'});
      const url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=name+'.'+extension; a.click(); setTimeout(()=>URL.revokeObjectURL(url),30000);
      status('Đã tạo file '+a.download+' ('+bytes.length.toLocaleString('vi')+' byte).');
    }
    const run = fn => async (...args) => {
      try { return await fn(...args); }
      catch(e) { console.error(e); status('Lỗi: '+e.message); }
      finally { focusEditor(); }
    };
    const check = ok => { if (!ok) throw new Error('Thao tác chưa thực hiện được.'); };
    let blankProject;
    const newScore = async () => {
      if (!blankProject) {
        const response=await fetch('templates/blank-piano.mscz');
        if (!response.ok) throw new Error('Không tải được mẫu piano.');
        blankProject=new Uint8Array(await response.arrayBuffer());
      }
      api.loadScoreData(blankProject,'Untitled score.mscz');
      setLoaded('Untitled score.mscz');
    };
    function replaceScore(action) {
      if (!dirty) return action();
      pendingAction=action;
      $('unsaved-text').textContent='Save changes to “'+name+'” before continuing?';
      $('unsaved-dialog').showModal();
    }
    const commands = {
      new:()=>replaceScore(newScore),
      open:()=>replaceScore(()=>$('file').click()),
      save:()=>check(api.saveProject()),
      export:()=>$('export-dialog').showModal(),
      about:()=>$('about-dialog').showModal()
    };
    window.addEventListener('keydown',event=>{
      unlockAudio();
      if (!api || document.querySelector('dialog[open]') || !(event.ctrlKey||event.metaKey)) return;
      const key=event.key.toLowerCase(), command=key==='o'?'open':key==='s'?'save':key==='n'?'new':key==='e'&&event.shiftKey?'export':null;
      if (command) { event.preventDefault(); event.stopImmediatePropagation(); run(commands[command])(); }
    },true);
    $('cancel-export').onclick=()=>{ $('export-dialog').close(); focusEditor(); };
    $('confirm-export').onclick=run(()=>{ const format=$('export-format').value; $('export-dialog').close(); check(api.exportScore(format)); });
    $('cancel-replace').onclick=()=>{ pendingAction=null; $('unsaved-dialog').close(); focusEditor(); };
    function proceed(save) {
      if (save) check(api.saveProject());
      const action=pendingAction; pendingAction=null; $('unsaved-dialog').close(); return action?.();
    }
    $('discard-replace').onclick=run(()=>proceed(false)); $('save-replace').onclick=run(()=>proceed(true));
    $('close-about').onclick=()=>{ $('about-dialog').close(); focusEditor(); };
    document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('close',()=>focusEditor()));
    try {
      api=await createMuApi({screen:$('screen'),
        onWebCommand:command=>run(commands[command]||(()=>{}))(),
        onDocumentState:(title,modified)=>{ dirty=modified; document.title=title+(modified?' *':'')+' — Pianist'; $('screen').dataset.modified=String(modified); },
        onExit:data=>{ $('loading').hidden=false; $('loading').textContent='Editor stopped. Reload to reopen it.'; status('Editor đã dừng: '+(data.text??data.code??'unknown')); },
        onProjectSaved:bytes=>download(bytes,'mscz'), onMxlExported:bytes=>download(bytes,'mxl'), onXmlExported:bytes=>download(bytes,'musicxml')
      });
      window.pianist=api;
      $('open').onclick=()=>$('file').click();
      $('file').onchange=run(async()=>{
        const file=$('file').files[0]; if (!file) return;
        status('Đang mở '+file.name+'…');
        try { await api.loadScoreFile(file); setLoaded(file.name); }
        finally { $('file').value=''; }
      });
      $('sample').onclick=run(async()=>{
        const response=await fetch('fixtures/piano.mxl'); if(!response.ok) throw new Error('Không tải được bài mẫu.');
        api.loadScoreData(new Uint8Array(await response.arrayBuffer()),'piano.mxl'); setLoaded('piano.mxl');
      });
      for(const[id,action]of[['undo','undo'],['redo','redo'],['select','select-all'],['up','pitch-up']]) $(id).onclick=run(()=>check(api.dispatchAction(action)));
      $('save').onclick=run(commands.save); $('mxl').onclick=run(()=>check(api.exportScore('mxl'))); $('xml').onclick=run(()=>check(api.exportScore('musicxml')));
      $('audio').onclick=run(()=>api.startAudioProcessing());
      await newScore();
      $('loading').hidden=true;
      ['open','sample','audio'].forEach(id=>$(id).disabled=false);
      // Prepare the engine while suspended. The first gesture unlocks Web Audio.
      await api.startAudioProcessing();
      focusEditor();
    } catch(e) { console.error(e); $('loading').textContent='Unable to start the editor. Reload to try again.'; status('Không khởi động được editor: '+e.message); }
    window.addEventListener('beforeunload',event=>{ if(hasScore&&dirty){event.preventDefault();event.returnValue='';} });
  </script>
</body>
</html>
