name: Publish Pianist Web

on:
  push:
    branches: [pianist/m0-web]
    paths: [deploy/pages-release.json]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pianist-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify optimized release and library
        run: python3 buildscripts/pianist/deploy-pages.py deploy/pages-release.json "$RUNNER_TEMP/pianist-site"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pianist-site
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v5
